name: Analytics dashboard
on:
  push:
    paths: ['analytics/**', '.github/workflows/analytics.yml']
  pull_request:
    paths: ['analytics/**', '.github/workflows/analytics.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: analytics }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: analytics/package.json }
      - run: npm install
      - run: npm run check
      - run: npm run build
