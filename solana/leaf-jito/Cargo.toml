[workspace]
members = ["programs/*", "leaf-jito-rate"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 0
incremental = false
codegen-units = 1

# Keep SBF toolchain (Rust 1.84.1) happy — refuse edition2024 crates.
[workspace.dependencies]
indexmap = "=2.7.1"
zeroize = { version = "=1.8.1", default-features = false }
hashbrown = "=0.15.2"
toml_edit = "=0.22.22"
serde_json = "=1.0.135"
